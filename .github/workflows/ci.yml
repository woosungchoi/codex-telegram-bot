name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  artifact-fixture:
    name: Upload workflow data fixture
    runs-on: ubuntu-latest
    steps:
      - name: Create text and package data
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-fixture"
          printf '%s\n' 'Artifact transport: 한글 검증' > "$RUNNER_TEMP/artifact-fixture/review.md"
          printf '%s\n' '{"name":"transport-fixture","version":"1.0.0"}' > "$RUNNER_TEMP/artifact-fixture/package.json"
      # Match the producers in codex-pr-review and codex-sdk-update.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-data-검증
          path: ${{ runner.temp }}/artifact-fixture/
          if-no-files-found: error
          retention-days: 1

  artifact-transport:
    name: Artifact transport compatibility
    needs: artifact-fixture
    runs-on: ubuntu-latest
    steps:
      # Keep the default digest-mismatch=error integrity check enabled.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workflow-data-검증
          path: ${{ runner.temp }}/artifact-download
      - name: Verify extraction and exact data bytes without executing contents
        run: |
          printf '%s\n' 'Artifact transport: 한글 검증' | cmp - "$RUNNER_TEMP/artifact-download/review.md"
          printf '%s\n' '{"name":"transport-fixture","version":"1.0.0"}' | cmp - "$RUNNER_TEMP/artifact-download/package.json"
          test "$(find "$RUNNER_TEMP/artifact-download" -type f | wc -l)" -eq 2

  coverage:
    name: Integration coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --audit=false
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/

  check:
    name: Check Node ${{ matrix.node-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci --audit=false

      - name: Verify
        run: npm run verify

      - name: Check GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Pack dry-run
        run: npm pack --dry-run --json

      - name: Build
        run: npm run build --if-present

  security-audit:
    name: Security audit
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false

      - name: Audit dependencies
        run: npm run audit:ci -- --audit-level moderate --attempts 3 --retry-delay-ms 10000

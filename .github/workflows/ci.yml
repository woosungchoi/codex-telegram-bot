name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci --audit=false

      - name: Verify
        run: npm run verify

      - name: Check GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Pack dry-run
        run: npm pack --dry-run --json

      - name: Build
        run: npm run build --if-present

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false

      - name: Audit dependencies
        run: npm run audit:ci -- --audit-level moderate --attempts 3 --retry-delay-ms 10000

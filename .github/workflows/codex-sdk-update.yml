name: Codex Dependency Update

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Test Latest Codex Packages
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Check latest versions
        id: version
        run: |
          current_sdk="$(node -p "require('./package.json').dependencies['@openai/codex-sdk']")"
          current_cli="$(node -p "require('./package.json').devDependencies['@openai/codex']")"
          latest_sdk="$(npm view @openai/codex-sdk version 2>/dev/null || true)"
          latest_cli="$(npm view @openai/codex version 2>/dev/null || true)"
          if [ -z "$latest_sdk" ]; then
            latest_sdk="$current_sdk"
            sdk_available=false
          else
            sdk_available=true
          fi
          if [ -z "$latest_cli" ]; then
            latest_cli="$current_cli"
            cli_available=false
          else
            cli_available=true
          fi
          [[ "$current_sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$current_cli" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$latest_sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$latest_cli" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "current_sdk=$current_sdk"
            echo "latest_sdk=$latest_sdk"
            echo "current_cli=$current_cli"
            echo "latest_cli=$latest_cli"
            echo "sdk_available=$sdk_available"
            echo "cli_available=$cli_available"
          } >> "$GITHUB_OUTPUT"
          if [ "$sdk_available" != true ] || [ "$cli_available" != true ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Codex Dependency Update"
              echo
              echo "Skipped because one or more Codex npm packages are currently unavailable from the registry."
              echo
              echo "- \`@openai/codex-sdk\` available: \`$sdk_available\`"
              echo "- \`@openai/codex\` available: \`$cli_available\`"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$current_sdk" = "$latest_sdk" ] && [ "$current_cli" = "$latest_cli" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when already current
        if: ${{ steps.version.outputs.changed != 'true' }}
        run: echo "Codex packages are already current."

      - name: Update packages
        if: ${{ steps.version.outputs.changed == 'true' }}
        run: |
          if [ "${{ steps.version.outputs.sdk_available }}" = true ]; then
            npm install --ignore-scripts "@openai/codex-sdk@${{ steps.version.outputs.latest_sdk }}" --save-exact
          fi
          if [ "${{ steps.version.outputs.cli_available }}" = true ]; then
            npm install --ignore-scripts "@openai/codex@${{ steps.version.outputs.latest_cli }}" --save-dev --save-exact
          fi

      - name: Verify updated packages
        if: ${{ steps.version.outputs.changed == 'true' }}
        run: |
          npm run check
          npm test
          if [ "${{ steps.version.outputs.cli_available }}" = true ]; then
            npm install -g --ignore-scripts "@openai/codex@${{ steps.version.outputs.latest_cli }}"
            codex --version
          else
            echo "Skipping Codex CLI smoke test because @openai/codex is unavailable."
          fi

      - name: Upload package data only
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-update
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Validate data and create update PR
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-update
          path: ${{ runner.temp }}/package-update
      - name: Publish validated JSON with trusted helper (no package execution)
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTOMATION_TOKEN || github.token }}
          BASE_SHA: ${{ github.sha }}
        run: node scripts/publish_package_update.mjs "$RUNNER_TEMP/package-update"

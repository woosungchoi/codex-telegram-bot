name: Codex PR Review

# Credentialed tool execution is disabled until auth/tool namespaces are isolated.
# This workflow does not receive OAuth, install a CLI or publish model output.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-disabled:
    name: Credentialed reviewer disabled
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use maintainer review; no automated security verdict is produced.'
